name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tools integration_test
      - run: flutter analyze

      - name: Verify generated catalog is fresh
        run: |
          python3 tools/generate_catalog.py
          git diff --exit-code lib/data/question_catalog.dart

      - run: flutter test --coverage

      - name: Coverage summary
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lcov
          summary=$(lcov --summary coverage/lcov.info 2>&1 | tail -2 || true)
          echo "$summary"
          {
            echo "### Line coverage"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  integration-test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: flutter test integration_test
