# Release pipeline: a v* tag (or a manual dispatch) builds the Android APK
# and attaches it to a GitHub Release. The web demo lives on GitHub Pages
# (deployed on every push to main by pages.yml), so it is not rebuilt here.
#
# The APK is debug-signed — labeled as a demo build in the release notes —
# because no production signing key exists yet.
#
# Run the integration smoke locally before tagging:
#   flutter test integration_test

name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get

      # Debug-signed: installs and runs for a demo; do not ship as production.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: devmate-android-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devmate-android-demo-apk
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**Demo APK is debug-signed — for trying the app, not production.** Web demo: https://sergionius.github.io/Devmate/" \
            artifacts/app-debug.apk
